<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subset Sum DP Visualizer</title>
    <style>
      :root {
        --bg: #f8f9fa;
        --primary: #2c3e50;
        --naive: #e74c3c;
        --dp: #3498db;
        --cache-hit: #f1c40f;
        --success: #2ecc71;
        --fail: #95a5a6;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: var(--bg);
        color: var(--primary);
      }

      .header {
        text-align: center;
        max-width: 800px;
        margin: 0 auto 30px auto;
      }

      .array-display {
        font-size: 1.5em;
        letter-spacing: 2px;
        font-family: monospace;
        background: white;
        padding: 10px 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        display: inline-block;
        margin-bottom: 10px;
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 30px;
      }

      button {
        padding: 12px 24px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        color: white;
        transition: transform 0.1s, opacity 0.2s;
      }
      button:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }
      button:disabled {
        background: #bdc3c7;
        cursor: not-allowed;
        transform: none;
      }

      #btn-naive {
        background-color: var(--naive);
      }
      #btn-dp {
        background-color: var(--dp);
      }
      #btn-reset {
        background-color: #7f8c8d;
      }

      .container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }

      .panel {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        min-height: 500px;
        display: flex;
        flex-direction: column;
      }

      .stats {
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 2px solid #eee;
        font-size: 1.1em;
      }

      .call-tree {
        flex-grow: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      /* The Function Call Blocks */
      .call-box {
        padding: 8px 12px;
        border-radius: 6px;
        color: white;
        font-family: monospace;
        font-size: 0.95em;
        display: flex;
        justify-content: space-between;
        animation: slideIn 0.3s ease forwards;
        opacity: 0;
      }

      @keyframes slideIn {
        from {
          transform: translateX(-10px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      .box-naive {
        background-color: var(--naive);
      }
      .box-dp {
        background-color: var(--dp);
      }

      .box-hit {
        background-color: var(--cache-hit);
        color: black;
        border: 2px solid #d4ac0d;
        font-weight: bold;
      }

      .box-success {
        background-color: var(--success);
      }
      .box-fail {
        background-color: var(--fail);
      }

      .branch-line {
        display: inline-block;
        width: 20px;
        border-bottom: 2px solid #ccc;
        margin-right: 5px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Partition Equal Subset Sum</h1>
      <div class="array-display">nums = [1, 1, 2, 4]</div>
      <h3>Target Sum: <span style="color: #e74c3c">4</span></h3>
      <p>
        Watch how index 2 with a sum of 1 <strong>dfs(2, 1)</strong> is reached
        through multiple different paths. <br />Naive calculates it every time.
        DP catches it.
      </p>
    </div>

    <div class="controls">
      <button id="btn-naive">Run Naive Recursion</button>
      <button id="btn-dp">Run DP (Memoization)</button>
      <button id="btn-reset">Reset</button>
      <div style="display: flex; align-items: center; margin-left: 15px">
        <label style="margin-right: 10px">Speed:</label>
        <input type="range" id="speed" min="10" max="800" value="300" />
      </div>
    </div>

    <div class="container">
      <div class="panel">
        <h2 style="color: var(--naive); margin-top: 0">Naive O(2^N)</h2>
        <div class="stats">Calls: <strong id="naive-calls">0</strong></div>
        <div class="call-tree" id="naive-tree"></div>
      </div>

      <div class="panel">
        <h2 style="color: var(--dp); margin-top: 0">Memoized O(N * Target)</h2>
        <div class="stats">
          Calls: <strong id="dp-calls">0</strong> | Cache Hits:
          <strong id="dp-hits" style="color: #b99700">0</strong>
        </div>
        <div class="call-tree" id="dp-tree"></div>
      </div>
    </div>

    <script>
      const nums = [1, 1, 2, 4];
      const TARGET = 4;

      const btnNaive = document.getElementById("btn-naive");
      const btnDp = document.getElementById("btn-dp");
      const btnReset = document.getElementById("btn-reset");
      const speedSlider = document.getElementById("speed");

      const naiveTree = document.getElementById("naive-tree");
      const dpTree = document.getElementById("dp-tree");

      let isRunning = false;

      const sleep = () =>
        new Promise((res) => setTimeout(res, speedSlider.value));

      function createBox(text, depth, typeClass, status = "") {
        const wrapper = document.createElement("div");
        wrapper.style.marginLeft = `${depth * 25}px`;

        const box = document.createElement("div");
        box.className = `call-box ${typeClass}`;

        const textSpan = document.createElement("span");
        textSpan.innerHTML = text;

        const statusSpan = document.createElement("span");
        statusSpan.innerText = status;

        box.appendChild(textSpan);
        box.appendChild(statusSpan);
        wrapper.appendChild(box);

        return wrapper;
      }

      function setUIState(disabled) {
        isRunning = disabled;
        btnNaive.disabled = disabled;
        btnDp.disabled = disabled;
      }

      // --- NAIVE RECURSION ---
      async function runNaive() {
        if (isRunning) return;
        setUIState(true);
        naiveTree.innerHTML = "";
        let calls = 0;
        const callsDisplay = document.getElementById("naive-calls");

        async function dfs(i, sum, depth, choiceStr) {
          calls++;
          callsDisplay.innerText = calls;

          let boxText = choiceStr
            ? `↳ dfs(${i}, ${sum}) <span style="font-size:0.8em; opacity:0.8">(${choiceStr})</span>`
            : `dfs(${i}, ${sum})`;
          let boxType = "box-naive";
          let status = "";

          // Base Cases Evaluation
          if (sum === TARGET) {
            boxType = "box-success";
            status = "✅ Found!";
          } else if (sum > TARGET || i === nums.length) {
            boxType = "box-fail";
            status = "❌ Fail";
          }

          const box = createBox(boxText, depth, boxType, status);
          naiveTree.appendChild(box);
          box.scrollIntoView({ behavior: "smooth", block: "end" });

          await sleep();

          if (sum === TARGET) return true;
          if (sum > TARGET || i === nums.length) return false;

          // Recursive Steps
          const pick = await dfs(
            i + 1,
            sum + nums[i],
            depth + 1,
            `picked ${nums[i]}`
          );
          if (pick) return true; // Short-circuit if found

          const dontPick = await dfs(
            i + 1,
            sum,
            depth + 1,
            `skipped ${nums[i]}`
          );
          return dontPick;
        }

        await dfs(0, 0, 0, "");
        setUIState(false);
      }

      // --- DP MEMOIZATION ---
      async function runDP() {
        if (isRunning) return;
        setUIState(true);
        dpTree.innerHTML = "";

        let calls = 0;
        let hits = 0;
        const callsDisplay = document.getElementById("dp-calls");
        const hitsDisplay = document.getElementById("dp-hits");

        const memo = new Map();

        async function dfs(i, sum, depth, choiceStr) {
          calls++;
          callsDisplay.innerText = calls;

          let boxText = choiceStr
            ? `↳ dfs(${i}, ${sum}) <span style="font-size:0.8em; opacity:0.8">(${choiceStr})</span>`
            : `dfs(${i}, ${sum})`;

          // 1. Base Cases
          if (sum === TARGET) {
            const box = createBox(boxText, depth, "box-success", "✅ Found!");
            dpTree.appendChild(box);
            await sleep();
            return true;
          }
          if (sum > TARGET || i === nums.length) {
            const box = createBox(boxText, depth, "box-fail", "❌ Fail");
            dpTree.appendChild(box);
            await sleep();
            return false;
          }

          // 2. CHECK CACHE
          const key = `${i}-${sum}`;
          if (memo.has(key)) {
            hits++;
            hitsDisplay.innerText = hits;
            const box = createBox(
              `⚡ CACHE HIT: dfs(${i}, ${sum})`,
              depth,
              "box-hit",
              `Returned ${memo.get(key)}`
            );
            dpTree.appendChild(box);
            box.scrollIntoView({ behavior: "smooth", block: "end" });
            await sleep();
            return memo.get(key);
          }

          // Render normal DP box
          const box = createBox(boxText, depth, "box-dp", "Evaluating...");
          dpTree.appendChild(box);
          box.scrollIntoView({ behavior: "smooth", block: "end" });
          await sleep();

          // 3. Recursive Steps
          let pick = await dfs(
            i + 1,
            sum + nums[i],
            depth + 1,
            `picked ${nums[i]}`
          );
          if (pick) {
            memo.set(key, true);
            return true;
          }

          let dontPick = await dfs(i + 1, sum, depth + 1, `skipped ${nums[i]}`);

          // 4. SAVE TO CACHE
          memo.set(key, dontPick);
          return dontPick;
        }

        await dfs(0, 0, 0, "");
        setUIState(false);
      }

      function reset() {
        if (isRunning) return;
        naiveTree.innerHTML = "";
        dpTree.innerHTML = "";
        document.getElementById("naive-calls").innerText = "0";
        document.getElementById("dp-calls").innerText = "0";
        document.getElementById("dp-hits").innerText = "0";
      }

      btnNaive.addEventListener("click", runNaive);
      btnDp.addEventListener("click", runDP);
      btnReset.addEventListener("click", reset);
    </script>
  </body>
</html>
